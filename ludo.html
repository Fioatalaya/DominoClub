<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ludo · Dominó Club</title><style>
*{box-sizing:border-box}body{margin:0;background:#09111e;color:#fff;font-family:Arial,sans-serif}.app{max-width:520px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.back{color:#fff;text-decoration:none;font-size:28px}.top b{color:#f5c542}.board{aspect-ratio:1;display:grid;grid-template-columns:repeat(15,1fr);background:#f3f0e8;border:5px solid #17233a;border-radius:16px;overflow:hidden;box-shadow:0 18px 40px #0008}.cell{border:1px solid #c8c5bd;position:relative}.red{background:#d95757}.green{background:#48a86b}.yellow{background:#e4bd3f}.blue{background:#4e83cf}.safe{box-shadow:inset 0 0 0 2px #fff9}.piece{position:absolute;left:24%;top:12%;width:52%;height:64%;border:2px solid #fff;border-radius:50% 50% 42% 42%;box-shadow:0 2px 4px #0008;transform-origin:50% 100%}.piece:after{content:"";position:absolute;left:15%;right:15%;bottom:-18%;height:32%;background:inherit;border:2px solid #fff;border-top:0;border-radius:0 0 45% 45%}.panel{margin-top:14px;background:#111c2e;border:1px solid #34445f;border-radius:18px;padding:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.dice{width:64px;height:64px;border-radius:16px;background:#fff;color:#111;font-size:28px;font-weight:900;border:0}.roll{flex:1;border:0;border-radius:14px;padding:15px;background:#f5c542;color:#17130a;font-weight:900;font-size:16px}.status{color:#aeb9cc;margin:10px 0 0;font-size:13px}.legend{display:flex;justify-content:space-between;margin-top:12px;font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.setup{background:#111c2e;border:1px solid #34445f;border-radius:18px;padding:14px;margin-bottom:14px}.setup h2{margin:0 0 12px}.modes,.colors{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 14px}.choice{border:1px solid #465674;background:#17243a;color:#fff;border-radius:12px;padding:11px;font-weight:800}.choice.active{outline:3px solid #f5c542}.choice[disabled]{opacity:.45}.start{width:100%;border:0;border-radius:14px;padding:14px;background:#f5c542;font-weight:900}.center{position:absolute;inset:40%;background:conic-gradient(#48a86b 0 25%,#e4bd3f 0 50%,#4e83cf 0 75%,#d95757 0);z-index:2;pointer-events:none}.boardwrap{position:relative}.hidden{display:none}</style></head><body><main class="app"><header class="top"><a class="back" href="index.html">‹</a><div><strong>LUDO</strong> · <b>DOMINÓ CLUB</b></div><span>🪙 10,000</span></header><section id="setup" class="setup"><h2>Configura tu partida</h2><small>Modo de juego</small><div class="modes"><button class="choice active" data-mode="online">🌐 Online</button><button class="choice" data-mode="friends">👥 Con amigos</button><button class="choice" data-mode="coins">🪙 Monedas virtuales</button><button class="choice" disabled>💵 Dinero real · Próximamente</button></div><small>Escoge tu color</small><div class="colors"><button class="choice active" data-color="red">🔴 Rojo</button><button class="choice" data-color="green">🟢 Verde</button><button class="choice" data-color="yellow">🟡 Amarillo</button><button class="choice" data-color="blue">🔵 Azul</button></div><button id="startGame" class="start">EMPEZAR PARTIDA</button></section><div class="boardwrap"><div id="board" class="board" aria-label="Tablero de Ludo"></div><div class="center"></div></div><section id="gamePanel" class="panel hidden"><div class="row"><button id="dice" class="dice">⚄</button><button id="roll" class="roll">TIRAR DADO</button></div><p id="status" class="status">Tu turno · rojo. Saca 6 para poner una ficha en juego.</p><div class="legend"><span><i class="dot red"></i>Tú</span><span><i class="dot green"></i>J2</span><span><i class="dot yellow"></i>J3</span><span><i class="dot blue"></i>J4</span></div></section></main><script src="ludo.js"></script></body></html>
