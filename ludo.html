<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ludo · Dominó Club</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18365e,#08111f 55%);color:#fff;font-family:Arial,sans-serif}.app{max-width:520px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.back{color:#fff;text-decoration:none;font-size:28px}.top b{color:#f5c542}.setup,.panel{background:linear-gradient(145deg,#152844,#0e192b);border:1px solid #405579;border-radius:20px;padding:15px;margin-bottom:14px}.modes,.colors{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:9px 0 15px}.choice{border:1px solid #52698e;background:#1b3152;color:#fff;border-radius:14px;padding:12px;font-weight:800}.choice.active{outline:3px solid #f5c542}.start,.roll{border:0;border-radius:14px;padding:15px;background:linear-gradient(#ffe167,#e8b82d);font-weight:900}.start{width:100%}.boardwrap{position:relative}.board{aspect-ratio:1;display:grid;grid-template-columns:repeat(15,1fr);background:#faf8f0;border:6px solid #17233a;border-radius:18px;overflow:hidden;box-shadow:0 18px 40px #0008}.cell{border:1px solid #d0cdc4;position:relative}.red{background:#ed4d5a}.green{background:#35b96c}.yellow{background:#f4c73e}.blue{background:#4287e7}.piece{position:absolute;left:25%;top:8%;width:50%;height:56%;border:2px solid #fff;border-radius:50%;box-shadow:0 3px 6px #0008;z-index:3}.piece:before{content:"";position:absolute;left:14%;right:14%;top:60%;height:55%;background:inherit;border:2px solid white;border-radius:45% 45% 25% 25%}.piece:after{content:"";position:absolute;left:-18%;right:-18%;top:100%;height:22%;background:inherit;border:2px solid white;border-radius:50%}.center{position:absolute;inset:40%;background:conic-gradient(#35b96c 0 25%,#f4c73e 0 50%,#4287e7 0 75%,#ed4d5a 0);z-index:2;clip-path:polygon(0 0,100% 0,100% 100%,0 100%);pointer-events:none}.row{display:flex;gap:12px}.dice{width:70px;height:70px;border:0;border-radius:17px;background:white;font-size:34px}.roll{flex:1}.status{color:#bdc9da}.legend{display:flex;justify-content:space-between;font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.hidden{display:none}</style></head><body><main class="app"><header class="top"><a class="back" href="index.html">‹</a><div><strong>LUDO</strong> · <b>DOMINÓ CLUB</b></div><span>🪙 10,000</span></header><section id="setup" class="setup"><h2>Configura tu partida</h2><small>Modo de juego</small><div class="modes"><button class="choice active" data-mode="online">🌐 Online</button><button class="choice" data-mode="friends">👥 Con amigos</button><button class="choice" data-mode="coins">🪙 Monedas virtuales</button><button class="choice" data-mode="bet">🏆 Apuesta con monedas</button></div><small>Escoge tu color</small><div class="colors"><button class="choice active" data-color="red">🔴 Rojo</button><button class="choice" data-color="green">🟢 Verde</button><button class="choice" data-color="yellow">🟡 Amarillo</button><button class="choice" data-color="blue">🔵 Azul</button></div><button id="startGame" class="start">EMPEZAR PARTIDA</button></section><div class="boardwrap"><div id="board" class="board"></div><div class="center"></div></div><section id="gamePanel" class="panel hidden"><div class="row"><button id="dice" class="dice">⚄</button><button id="roll" class="roll">TIRAR DADO</button></div><p id="status" class="status">Tu turno.</p><div class="legend"><span>🔴 Rojo</span><span>🟢 Verde</span><span>🟡 Amarillo</span><span>🔵 Azul</span></div></section></main><script src="ludo.js?v=2"></script></body></html>
