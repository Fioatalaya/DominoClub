<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101722">
  <meta name="description" content="Dominó Club - prototipo de juego con monedas virtuales">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=20260930-chain-premium1">
  <title>Dominó Club</title>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <div class="brand">DOMINÓ <span>CLUB</span></div>
        <div class="sub">Sala de juego</div>
      </div>
      <button class="avatar" id="profileBtn" aria-label="Perfil">F</button>
    </header>

    <main>
      <section class="hero">
        <div>
          <p class="eyebrow">BIENVENIDO</p>
          <h1>Juega con monedas virtuales</h1>
          <p class="muted">Crea una mesa o entra a una partida disponible.</p>
        </div>
        <div class="wallet">
          <span>🪙</span>
          <strong id="balance">10,000</strong>
          <small>monedas</small>
        </div>
      </section>

      <section class="quick">
        <button class="quick-btn" data-action="daily">🎁 <span>Bono diario</span></button>
        <button class="quick-btn" data-action="history">📜 <span>Historial</span></button>
        <button class="quick-btn" data-action="help">❓ <span>Ayuda</span></button>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>Mesas disponibles</h2>
          <button class="text-btn" id="refreshBtn">Actualizar</button>
        </div>
        <div id="tables" class="tables"></div>
      </section>

      <section class="section">
        <div class="section-head"><h2>Crear una mesa</h2></div>
        <div class="create-card">
          <label>Entrada
            <select id="stake">
              <option value="100">100 monedas</option>
              <option value="500">500 monedas</option>
              <option value="1000">1,000 monedas</option>
            </select>
          </label>
          <button class="primary" id="createBtn">Crear mesa</button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navegación">
      <button class="nav active" data-tab="home">⌂<span>Inicio</span></button>
      <button class="nav" data-tab="rooms">♟<span>Mesas</span></button>
      <button class="nav" data-tab="bonus">🎁<span>Bonos</span></button>
      <button class="nav" data-tab="profile">●<span>Perfil</span></button>
    </nav>
  </div>

  <div class="modal hidden" id="modal">
    <div class="modal-card">
      <button class="close" id="closeModal">×</button>
      <h2 id="modalTitle">Información</h2>
      <p id="modalText"></p>
      <button class="primary" id="modalOk">Entendido</button>
    </div>
  </div>
  <script src="app.js?v=20260930-chain-premium1"></script>
</body>
</html>
